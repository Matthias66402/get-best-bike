services:
  db:
    image: pgvector/pgvector:pg17
    container_name: getbestbike_db
    environment:
      POSTGRES_USER: bike
      POSTGRES_PASSWORD: bike
      POSTGRES_DB: bike
    ports:
      - "5441:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bike"]
      interval: 5s
      retries: 10

  # Läuft im Container: Windows-Anwendungssteuerung blockiert die nativen Postgres-Treiber (asyncpg/psycopg).
  backend:
    build: ./backend
    container_name: getbestbike_backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bike:bike@db:5432/bike
      TEST_DATABASE_URL: postgresql+asyncpg://bike:bike@db:5432/bike_test
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8011:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
